  "summary": "Collab acceptance may normalize or derive fields only when the result is mechanically determined by an explicit repair policy and authoritative package evidence. Semantic intent, identity, scope, and compatibility decisions are never invented.",
  "title": "Collab repairs only deterministic validation defects",
