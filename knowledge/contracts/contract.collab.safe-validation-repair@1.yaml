      "rule.collaboration.producer-owned-correction"
    ],
    "superseded_by": null,
    "supersedes": []
  },
  "schema_version": "1.0",
  "scope": {
    "phases": [
      "handoff",
      "recover"
    ],
    "repositories": [
      "collab"
    ],
    "roles": [
