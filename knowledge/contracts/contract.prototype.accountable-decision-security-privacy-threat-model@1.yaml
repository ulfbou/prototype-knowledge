  "content": {
    "carrier_naming": "phase-<phase-id>-<description>.dx.txt",
    "decisions": [
      {
        "id": "14.1",
        "locked": [
          "the threat model covers the initial local single-process stdio MCP proof and does not speculate about deferred network, distributed, multi-tenant, remote-authentication, service-hosting, or autonomous-execution architectures",
          "protected assets are authoritative ledger bytes, ledger semantics and integrity, authority-bearing runtime state, mutation truth, bounded evidence, secrets and sensitive information, protocol and diagnostic channels, executable and dependency integrity, and application-owned product semantics",
          "mandatory objectives SO14-01 through SO14-10 prohibit unauthorized mutation and authority injection, require fail-closed pre-persistence enforcement, evidence preservation, disclosure minimization, bounded resources, offline operation, protocol isolation, secret non-persistence, and semantic truth under hostile input",
          "untrusted input is data and never configuration or authority",
          "security failures before persistence produce RESOLVED_ZERO; possible persistence keeps UNRESOLVED; confirmed persistence remains RESOLVED_ONE",
          "security controls may restrict but cannot expand authority or silently change ADS product semantics"
        ],
        "name": "Threat Model Scope, Protected Assets, and Security Objectives"
      },
      {
        "id": "14.2",
        "locked": [
          "OS process identity, runtime-instance identity, configured local principal identity, ADS actor identity, operation identity, idempotency identity, and recovery principal identity remain distinct",
          "authentication is local, launch-bound, single-principal, and stdio-only with no network login, token, API key, password prompt, cookie, remote identity provider, or loopback listener",
          "caller claims, MCP metadata, prompts, model output, evidence, and request-supplied environment variable names cannot establish identity, role, authority, policy, operating mode, or recovery capability",
          "accepted runtime roles remain observer, decision-producer, reflection-engine, maintainer, and system-infrastructure; technical delivery operator is a persona and outcome-producer remains a responsibility description",
          "Application exclusively owns deny-by-default operation-specific authorization, with pre-execution evaluation and append-critical recheck",
          "authorization denial is BLOCKED with category AUTHORITY, code ADS_ROLE_AUTHORITY_DENIED, RESOLVED_ZERO, and zero appends",
          "authority-bearing configuration cannot hot reload and incoherence prevents READY or closes admission",
          "ordinary maintainer authority does not imply recovery authority"
        ],
        "name": "Runtime Identity, Authentication, and Authorization Enforcement"
      },
      {
        "id": "14.3",
        "locked": [
          "authoritative ledger, read-only evidence, non-authoritative generated state, application and distribution files, and temporary acquisition state are separate filesystem authority domains",
          "configured roots are absolute, non-overlapping, physically identified, role-scoped, checked before READY, and never selected or expanded by ordinary requests",
          "external evidence selection uses a configured root identifier and bounded root-relative logical path; absolute, traversal, device, UNC, stream, wildcard, variable-expansion, and executable forms are rejected",
          "lexical normalization and string-prefix comparison never prove containment",
          "protected traversal is handle-relative or equivalently identity-safe, does not follow symbolic links, junctions, unsafe reparse points, mount redirections, devices, pipes, or sockets, and binds validation and use to the same opened object",
          "ledger root and file identity are established before READY and rechecked inside every append-critical section",
          "ordinary append extends the established ledger file with one canonical record and LF; full rewrites, swaps, silent recreation, normalization, skipping, and truncation are forbidden",
          "evidence is read-only, bounded, hash-aware, and stable or explicitly DRIFT_DETECTED",
          "recovery is separately authenticated, explicitly authorized, exclusive, evidence-preserving, and never repairs an invalid complete record automatically"
        ],
        "name": "Filesystem Containment, Ledger Protection, and Link-Race Defenses"
      },
      {
        "id": "14.4",
        "locked": [
          "data classifications are PUBLIC, INTERNAL, SENSITIVE, SECRET, and PROHIBITED, with the most restrictive applicable classification controlling",
          "ADS acquires, processes, persists, and presents only operation-required data",
          "credentials are prohibited from MCP arguments, ledger records, reflections, proposals, projections, protocol results, and ordinary diagnostics",
          "full environment dumps, private reasoning, unrestricted logs, unrestricted evidence bodies, raw authentication assertions, and secret-bearing command lines are prohibited",
          "redaction is ADS-owned, occurs before disclosure to less-trusted components, and uses explicit deterministic states NONE, PARTIAL, FULL, and EXCLUDED_PROHIBITED_CONTENT",
          "source integrity and redacted-representation integrity remain distinct; redaction never repairs mismatch or increases authority, completeness, confidence, or causal strength",
          "reflection receives only bounded retained and redacted evidence and its output is revalidated for leakage, invented evidence, and unsupported causal claims",
          "stdout remains minimally disclosive and protocol-only; exceptions and dependency messages are untrusted and safely rendered",
          "secret detection is bounded defense in depth and cannot prove arbitrary content secret-free",
          "suspected exposure stops propagation without persisting the secret, rotating credentials automatically, rewriting immutable records, or mutating repositories"
        ],
        "name": "Secrets, Sensitive Data, Redaction, and Diagnostic Disclosure"
      },
      {
        "id": "14.5",
        "locked": [
          "every externally influenced operation runs under explicit, finite, cumulative, server-controlled, versioned limits that caller input cannot enlarge, disable, reset, or reinterpret",
          "one immutable resource-limit policy identity is bound to runtime identity before READY; missing, unknown, contradictory, negative, or overflowing limits prevent readiness",
          "protocol framing is bounded before Application request construction, including decoded bytes, depth, collection counts, string lengths, and diagnostic amplification",
          "admission and concurrency limits preserve one writer, authoritative exclusion, fairness independent of caller urgency, and no degraded mutation path",
          "evidence acquisition bounds path size, traversal depth, entries, per-item bytes, aggregate bytes, retained bytes, duration, and concurrency; redaction and hashing do not reset budgets",
          "reflection generation, product results, diagnostics, generated artifacts, idempotency lookup, and transaction reconstruction are bounded",
          "startup READY requires full authoritative-ledger validation within the supported deployment envelope; a bounded lookup cannot convert unresolved or unknown state into not found",
          "monotonic budgets and cancellation preserve RESOLVED_ZERO before possible persistence and three-way certainty after persistence may begin",
          "authorization, containment, integrity, and unresolved persistence failures are not automatically retried",
          "capacity pressure may restrict mutation or begin draining but cannot weaken validation, transfer authority, select alternate storage, activate remote fallback, or start automatic recovery"
        ],
        "name": "Resource Limits, Denial-of-Service Resistance, and Bounded Execution"
      },
      {
        "id": "14.6",
        "locked": [
          "all direct, transitive, build-time, test-only, analyzer, generated-code, native, SDK, runtime, and external package components are untrusted until explicitly qualified",
          "qualification records include exact identity, source, purpose, graph, license, security disposition, capability, platform, trimming, Native AOT, offline-runtime, replacement boundary, outcome, limitations, and requalification triggers",
          "package sources are explicit and mapped; versions are exact and centrally governed; committed lock files and locked restore fail closed on graph drift or source substitution",
          "dependencies provide bounded mechanics and never own ADS product semantics, identity, authority, policy, lifecycle, ledger validity, evidence meaning, mutation certainty, diagnostics, runtime disposition, recovery, or publication",
          "external package types remain isolated behind repository-owned adapters and do not leak into Domain or Application public contracts",
          "generated code is deterministic executable build output subject to review, architecture tests, trimming, Native AOT, and capability checks",
          "runtime package discovery, restore, update, plugin loading, reflection-based handler discovery, arbitrary process or shell execution, listeners, outbound network communication, remote fallback, and environment enumeration are prohibited",
          "vulnerability, advisory, provenance, licensing, platform, and behavioral evidence govern qualification and every material dependency update requires requalification",
          "Dx.Domain, the official C# MCP SDK, an RFC 8785 implementation, and xUnit remain conditional until direct evidence qualifies their exact versions and bounded uses",
          "delivered archives are passive, identifiable, contain no writable state or credentials, and preserve framework-dependent, self-contained, and Native AOT semantics"
        ],
        "name": "Dependency Trust, Supply-Chain Security, and Runtime Capability Restriction"
      },
      {
        "id": "14.7",
        "locked": [
          "security conditions are classified as rejected input, authority denial, containment failure, integrity failure, suspected secret exposure, resource abuse, dependency failure, runtime coherence loss, or persistence uncertainty",
          "response priority is authoritative truth, prevention of unsafe mutation, truthful completion certainty, containment of prohibited data, protocol safety, bounded evidence preservation, narrow restriction, and one safe non-executing operator action",
          "request-local containment is allowed only when runtime identity, policy, writer ownership, ledger identity, containment, protocol isolation, secret handling, mutation truth, and future enforcement remain coherent",
          "runtime dispositions remain CONTINUE, RESTRICT_MUTATION, ENTER_DEGRADED_INSPECTION, BEGIN_DRAINING, and TERMINATE_UNCLEAN with the previously locked precedence",
          "degraded inspection is non-mutating, non-authoritative, not a lifecycle state, not an operating mode, and grants no recovery or takeover authority",
          "ledger history, operational diagnostics, generated security artifacts, durable audit evidence, and recovery evidence remain separate authority domains",
          "rejected hostile requests do not create attacker-controlled lifecycle appends; material durable audit evidence requires a separately authorized bounded workflow",
          "recovery requires a separately authenticated principal, exact asset and action scope, closed admission, exclusive ownership, source-byte preservation, validated plan, explicit mutation certainty, and post-action full validation",
          "the only initial ledger-content recovery action is truncation of a proven incomplete final fragment; invalid complete records are never repaired, skipped, normalized, rewritten, or removed automatically",
          "technical recovery does not automatically restore READY, actor authority, writer authority, or operating mode",
          "ADS performs no automatic credential rotation, package update, remote notification, repository mutation, or destructive remediation"
        ],
        "name": "Security Failure Response, Recovery Authorization, and Audit Evidence"
      },
      {
        "id": "14.8",
        "locked": [
          "Decisions 14.1 through 14.7 are mutually consistent and accepted as one security and privacy baseline",
          "Phase 14 preserves all accepted product, authority, runtime, persistence, evidence, mutation, protocol, repository, and technology decisions through Phase 13",
          "the threat coverage includes adversarial MCP callers, mistaken local context, unstable filesystem state, deceptive evidence, untrusted reflection and dependency output, supply-chain compromise, stale runtime instances, and implementation defects",
          "residual risks remain explicit for privileged host administrators, incomplete secret detection, dependency unknowns, platform differences, local launch-bound authentication limits, no encryption-at-rest baseline, no cryptographic audit signatures, full-ledger startup cost, exceptional secret remediation, and operator-governed response",
          "Phase 15 must map every material Phase 14 claim to direct reproducible evidence; aggregate suite success cannot replace direct claim evidence",
          "PHASE_14_COMPLETE",
          "development remains unauthorized until Phase 18 returns READY or an explicitly accepted READY_WITH_BOUNDED_RISKS",
          "the next phase is Phase 15 Verification and Conformance Strategy",
          "Phase 15 may define verification mechanisms but cannot silently weaken or redefine the Phase 14 baseline"
        ],
        "name": "Phase 14 Security and Privacy Review and Lock"
      }
    ],
