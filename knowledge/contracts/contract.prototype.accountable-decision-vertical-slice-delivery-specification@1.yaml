    "decisions": [
      {
        "id": "17.1",
        "locked": [
          "Phase 17 converts accepted architecture into a complete non-implementing development specification for the initial vertical slice",
          "ulfbou/accountable-decision-system is the sole implementation repository",
          "The vertical slice retains Observation, Decision, Outcome, Reflection, and Proposal and ends at non-authoritative proposal or explicit block",
          "Work packages use stable WP17-NN identities and declare exact paths, projects, contracts, prerequisites, dependencies, artifacts, boundaries, verification, mappings, evidence, completion, and next package",
          "Every implementation-ready package is complete and placeholder-free",
          "Packages preserve continuous verification and avoid competing authority or knowingly invalid intermediate states",
          "Direct Phase 10, Phase 14, and Phase 15 evidence remains mandatory",
          "Phase 17 specifies commands and evidence but claims no unexecuted success",
          "The robust prototype uses production-shaped foundations and a supported path to stable release without speculative full-release scope",
          "Development remains unauthorized until an accepted Phase 18 READY or READY_WITH_BOUNDED_RISKS verdict"
        ],
        "name": "Delivery Scope, Repository Boundary, and Work-Package Model"
      },
      {
        "id": "17.2",
        "locked": [
          "Two maturity stages are Robust Prototype Release and Stable Full Release and neither creates runtime authority or lifecycle semantics",
          "The first Robust Prototype Release is product version 0.1.0 and is a usable distributable implementation of the accepted local slice",
          "Prototype acceptance requires direct claim evidence, supported-platform execution, output assessment, packaging, documentation, and absence of prohibited side effects",
          "Framework-dependent net10.0 is the semantic reference, self-contained is fallback, and Native AOT is preferred only after qualification",
          "Stable Full Release requires a separate evidence-based readiness decision and is not inferred from version 1.0.0",
          "Future evolution cannot reinterpret immutable records, weaken authority or mutation truth, convert blocks to protocol errors, make proposals authoritative, or hide topology changes",
          "No speculative plugin, bus, workflow, distributed, multi-tenant, remote MCP, migration, publication, or multi-agent framework is included",
          "Every executable and release artifact exposes coherent product, source, knowledge, framework, RID, output, schema, writer, reader, MCP, diagnostic, evidence, and lock identities"
        ],
        "name": "Release Stages, Version Baseline, and Graduation Boundary"
      },
      {
        "id": "17.3",
        "locked": [
          "Canonical solution is AccountableDecisionSystem.slnx in ulfbou/accountable-decision-system",
          "Top-level tracked domains are .config, .github/workflows, config, docs, evidence, fixtures, packages, schemas, scripts, src, and tests; .dx is ignored generated state",
          "Production projects are AccountableDecisionSystem.Domain, Application, Infrastructure, Host.Mcp, and App; only App is executable",
          "Dependency direction is Domain none; Application to Domain; Infrastructure to Application and Domain; Host.Mcp to Application and Domain; App to all",
          "Seven test projects are Domain.Tests, Application.Tests, Infrastructure.Tests, Host.Mcp.Tests, App.Tests, Architecture.Tests, and Conformance.Tests",
          "Every xUnit test class explicitly includes using Xunit;",
          "Source is organized by capability and responsibility, not Helpers, Utils, Common, Misc, Shared, Managers, or Services catch-alls",
          "Exact configuration examples, schema domains, fixture domains, evidence boundary, documentation paths, script domains, package domains, and CI boundary are locked",
          "Topology supports robust prototype and stable evolution without empty speculative extension points"
        ],
        "name": "Canonical Repository, Solution, and Artifact Topology"
      },
      {
        "id": "17.4",
        "locked": [
          "Initial identities are product 0.1.0; ads-configuration@1; ads-resource-limits@1; ads-redaction-policy@1; ads-ledger-record@1; ads-ledger-writer@1; ads-mcp-tools@1; ads-operation-result@1; ads-diagnostics@1; ads-evidence-reference@1; ads-recovery-plan@1; ads-compatibility-manifest@1; ads-verification-evidence@1",
          "Builds identify an accepted deterministic knowledge baseline without requiring prototype-knowledge at runtime",
          "Tracked examples are config/accountable-decision.example.json, resource-limits.example.json, redaction-policy.example.json, and config/README.md with corresponding versioned schemas",
          "Configuration domains are runtime, principal, actor, operatingMode, policy, ledger, evidence, resourceLimits, privacy, diagnostics, reflection, lifecycle, and recovery; unknown properties fail",
          "Authority-bearing configuration is explicit, validated before readiness, and immutable for one runtime instance",
          "Ledger configuration binds one absolute decision-ledger.jsonl, record and writer versions, readers, ownership, and flush policy without fallback or silent migration",
          "Evidence roots are absolute, separate, read-only, contained, bounded, and network-free",
          "Resource limits are finite, cumulative, immutable, overflow-checked, and caller-non-expandable",
          "Reflection is in-process and networkPermitted false for the robust prototype",
          "Commands are run, validate-config, inspect, recover-fragment, and version --format json",
          "ADS_CONFIG_PATH is the only optional config-path environment variable; explicit --config wins and no implicit search occurs",
          "CARRIER_SOURCE_DIR is external carrier workflow state and not ADS runtime configuration",
          "Inspection and recovery are distinct from ordinary runtime, and recovery requires a separate principal and plan"
        ],
        "name": "Contract Versions, Configuration Surface, and Runtime Launch Boundary"
      },
      {
        "id": "17.5",
        "locked": [
          "Exact Domain areas and principal semantic types cover actors, diagnostics, evidence, ledger, lifecycle, operations, reflection, results, and transactions",
          "Closed sets preserve accepted roles, modes, terminal classes, certainty, persistence completion, dispositions, ledger states, evidence states, finding strengths, lifecycle states, and degraded inspection",
          "DecisionLedgerRecord owns semantic content only and recognizes all accepted types while the prototype writes only Observation, Decision, Outcome, Reflection, and Proposal",
          "Payloads are ObservationPayload, DecisionPayload, OutcomePayload, ReflectionPayload, and ProposalPayload with accepted semantics",
          "Exact commands are CaptureObservation, RecordDecision, RecordOutcome, GenerateReflection, and GenerateProposal",
          "Exact queries are GetLedgerRecord, GetDecisionTransaction, ListIncompleteTransactions, FindSimilarFailures, GetReflectionInputs, and ValidateLedger",
          "Every mutating request binds OperationId, IdempotencyKey, SubjectId and rejects authority-bearing caller input",
          "Evaluation precedence is request/schema, ledger integrity/references, actor context, mode/policy, lifecycle, evidence/gates, append/idempotency, mutation",
          "Application ports are IAuthorizationPolicy, ICanonicalJson, IClock, IEvidenceStore, IFailureClassifier, IHashProvider, IIdentityGenerator, ILedgerAppender, ILedgerInspector, ILedgerReader, IReflectionGenerator, and IRuntimeContext",
          "Handlers use explicit constructor dependencies and no service locator or reflection discovery",
          "Same key and same normalized request replays with zero append; conflicting reuse appends nothing; unresolved completion resolves from authoritative history",
          "Every result preserves complete mutation disclosure and Application owns product diagnostic selection"
        ],
        "name": "Domain and Application Contract Topology"
      },
      {
        "id": "17.6",
        "locked": [
          "Exact Infrastructure areas and principal files cover canonicalization, evidence, filesystem, hashing, identity, ledger, reflection, recovery, and time",
          "RFC 8785 canonicalization is deterministic UTF-8 without BOM and covers ordering, escaping, Unicode, numbers, arrays, duplicates, and unsupported values",
          "Canonicalizer qualification prefers the smallest qualified exact dependency, otherwise repository-owned implementation, with no runtime selection",
          "SHA-256 uses System.Security.Cryptography.SHA256, omits only integrity.recordHash, produces 64 lowercase hex, appends one LF outside the digest, and has no hash chain",
          "Ledger decoder rejects BOM, CR, invalid UTF-8/JSON, duplicates, unsupported versions, noncanonical bytes, malformed hashes, and unknown required semantics",
          "Inspection distinguishes valid complete, valid with incomplete trailing fragment, invalid complete record, unsupported version, unavailable, and identity mismatch without repair",
          "Reads expose only validated records and explicit boundaries; unresolved state cannot silently become not found",
          "Append critical section rechecks admission, ownership, identity, boundary, idempotency, authority/mode facts, lifecycle/references, evidence identity, record validity, persistence, and mutation truth",
          "Persistence completion is ConfirmedNoAppend, ConfirmedAppend, or Unresolved and unresolved is resolved with the same identities rather than retried",
          "One writer process binds logical and physical ledger identity, process, runtime instance, writer version, and mechanism; elapsed time alone never authorizes takeover",
          "Linux and Windows containment are platform-qualified, identity-safe, and fail closed",
          "Evidence acquisition is read-only, cumulative-budgeted, stable or drift-detected, hash-aware, redaction-aware, and excludes prohibited content",
          "DeterministicFailureClassifier uses the closed taxonomy and DeterministicReflectionGenerator provides mandatory in-process offline behavior with untrusted output validation",
          "Recovery only truncates a proven incomplete trailing fragment under a validated ads-recovery-plan@1 after preservation and never repairs invalid complete records or restores authority"
        ],
        "name": "Infrastructure, Persistence, Evidence, and Reflection Adapter Topology"
      },
      {
        "id": "17.7",
        "locked": [
          "Host.Mcp has exact Diagnostics, Framing, Mapping, Protocol, Resources, Runtime, Schemas, and Tools areas and references only Application and Domain",
          "MCP baseline is 2026-07-28; server identity accountable-decision-system, title Accountable Decision System, version 0.1.0",
          "Official C# MCP SDK is conditional and must preserve deterministic explicit registration, bounds, cancellation, stdio isolation, trimming, AOT, platform, offline, and dependency rules; otherwise repository-owned implementation is used",
          "stdin and stdout are protocol-only and stderr is bounded diagnostics; ProtocolOutputWriter alone writes serialized stdout",
          "Bounded framing rejects malformed protocol before Application invocation",
          "Eight tools are explicitly ordered: ads_capture_observation, ads_record_decision, ads_record_outcome, ads_generate_reflection, ads_generate_proposal, ads_list_incomplete_transactions, ads_find_similar_failures, ads_validate_ledger",
          "Tools map one-to-one, reject reserved authority fields, and cannot access Infrastructure, configuration, recovery, or arbitrary files",
          "BLOCKED is an MCP success with isError false; FAILED preserves ADS diagnostics and mutation truth; JSON-RPC errors are protocol-specific",
          "Six resources are server capabilities, server health, ledger record, transaction, reflection inputs, and diagnostic code; all are bounded and read-only",
          "No prompts, subscriptions, dynamic registration, plugins, or network listener exist",
          "App owns explicit composition, commands, configuration, diagnostics, inspection, lifecycle, recovery, and thin Program.cs",
          "Startup establishes diagnostics, config, identities, principal, actor, policy, roots, ledger, ownership, complete validation, projections, handlers, MCP registry, streams, admission, and READY with zero appends",
          "Admission opens only in READY; draining closes admission first, preserves certainty, closes append before ownership release, and distinguishes clean from unclean termination",
          "Restart creates a new runtime instance and reconstructs authority from persisted state",
          "Inspect composes no appender and recover-fragment composes no MCP or ordinary handlers"
        ],
        "name": "MCP Host, Application Composition, and Process Lifecycle Topology"
      },
      {
        "id": "17.8",
        "locked": [
          "Canonical evidence, fixtures, Conformance test, and verification script directories are exact",
          "Authoritative claim catalog is evidence/catalogs/ads-verification-claims.v1.json with schema and complete mandatory V15 entries",
          "Phase 10 and Phase 14 mapping catalogs preserve E10-01 through E10-17, D10-P1 and D10-S1 through D10-S15, SO14-01 through SO14-10, and all mandatory V15 claims",
          "Evidence levels E1_STATIC through E6_REPRODUCIBLE_ARTIFACT remain ordered and non-substitutable",
          "Claim results distinguish pass, fail, blocked prerequisite, not run, not applicable, inconclusive, and accepted-scope deferral; only pass satisfies mandatory applicable claims",
          "Product demonstrations run from isolated known state and D10-P1 proves exactly five valid appends and no prohibited side effects",
          "Conformance harness uses actual executables, isolates all state and streams, invokes without shell, preserves bounded failures, and avoids machine dependencies",
          "Independent canonicalization, SHA-256, framing, mutation-delta, and ledger-semantic oracles do not solely reuse production logic",
          "Every mutation claim compares exact authoritative pre-state and post-state; zero is byte-identical and one is exactly one canonical LF record",
          "Versioned fixture manifests and deterministic fault identities preserve exact bytes, activation proof, and release non-activation",
          "Security, privacy, resource, recovery, MCP, concurrency, platform, output, and distribution claims receive direct evidence",
          "Matrix covers win-x64 and linux-x64 across framework-dependent, self-contained, Native AOT, and passive archive cells",
          "Evidence packages under .dx/ads/evidence contain coherent manifests, claims, demonstrations, matrix, dependencies, artifacts, diagnostics, summary, and checksums without prohibited data",
          "Aggregate verification has no force-pass and succeeds only when every mandatory applicable claim and required mapping, platform, dependency, artifact, documentation, and prohibited-effect check passes"
        ],
        "name": "Verification Assets, Claim Execution, and Evidence-Package Topology"
      },
      {
        "id": "17.9",
        "locked": [
          "Exact documents cover README, architecture, configuration, diagnostics, Windows/Linux installation, lifecycle, degraded inspection, troubleshooting, fragment recovery, security/privacy, verification, robust prototype, stable graduation, and known limitations",
          "Documentation explains but grants no authority or readiness and discrepancy causes documentation conformance failure",
          "Installation uses passive ZIP or TAR.GZ without services, daemons, PATH, registry, scheduled tasks, updates, or listeners",
          "Diagnostic reference is generated or validated against the catalog and recovery guide permits only separately authorized incomplete-fragment truncation",
          "Packaging definitions and scripts are exact and consume previously verified outputs without restore, hidden compile, network fetch, or source amendment",
          "Generated outputs live under .dx/ads/build, publish, packages, and release",
          "Archive names encode product, RID, and output class; shorter name is used only for the preferred qualified output",
          "Archives extract under accountable-decision-system-0.1.0 with bin, config, docs, licenses, manifests, schemas, README, and notices and no future empty directories",
          "Compatibility, dependency, artifact, and release manifests plus internal and external SHA-256 manifests are required",
          "Release stage is ROBUST_PROTOTYPE; packages contain no ledger, secrets, mutable state, deployed authority config, automatic action, or repository mutation",
          "Release candidates live under .dx/ads/release/0.1.0/<id> with coherent archives, evidence, manifests, reports, checksums, and summary",
