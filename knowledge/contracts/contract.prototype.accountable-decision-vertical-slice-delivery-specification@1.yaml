      {
        "id": "17.10",
        "locked": [
          "Twelve ordered packages are WP17-01 build foundation; WP17-02 Domain; WP17-03 Application; WP17-04 canonical JSON and reads; WP17-05 append and ownership; WP17-06 evidence and reflection; WP17-07 config/composition/lifecycle; WP17-08 stdio MCP; WP17-09 inspection/recovery; WP17-10 conformance and demonstrations; WP17-11 platform/package/docs; WP17-12 release aggregation",
          "Each package declares exact paths, contracts, prerequisites, dependencies, artifacts, boundaries, verification, mappings, evidence, completion, and next package",
          "Every package leaves a buildable placeholder-free repository passing applicable checks and no temporary competing semantics",
          "Package boundaries do not overclaim properties of doubles or omit real-adapter evidence",
          "From WP17-04 oracles apply; WP17-05 exact mutation evidence; WP17-08 composed process and stdout purity; WP17-09 recovery authority; WP17-10 evidence coverage; WP17-11 platform/archive/docs",
          "Package states are WP_PASS, WP_FAIL, WP_BLOCKED_PREREQUISITE, WP_NOT_RUN and only pass satisfies dependencies",
          "External dependency qualification occurs at the earliest consuming package and mandatory production dependencies cannot remain deferred for WP17-12",
          "Defects are classified by ownership and valid assertions are never weakened",
          "Packages form reviewable delivery boundaries while exact PR subdivision remains evidence-driven"
        ],
        "name": "Work Packages, Delivery Order, and Incremental Acceptance Gates"
      },
      {
        "id": "17.11",
        "locked": [
          "Canonical PowerShell 7 and POSIX shell scripts own repository validation, schemas, docs, architecture, component tests, conformance, demonstrations, complete verification, packaging, and release candidate workflows",
          "Restore is dotnet restore AccountableDecisionSystem.slnx --locked-mode using global.json, NuGet.Config, central package management, lock files, sources, and source mapping",
          "Release build is dotnet build AccountableDecisionSystem.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true",
          "Component and architecture tests use exact dotnet test commands and focused success never replaces full applicable gates",
          "Conformance and demonstrations use actual selected executables, isolated state, stdio, independent oracles, and machine-readable results",
          "Complete verification runs validation, restore, build, architecture, components, process, security/faults, demonstrations, platform/output, distribution, evidence validation, and aggregate in order",
          "Publish contracts cover framework-dependent, self-contained, and Native AOT explicitly for win-x64 and linux-x64 with no silent fallback",
          "Packaging consumes exact verified publish directories and neither restores nor compiles nor selects latest heuristically",
          "Release candidate commands require clean tracked state, exact revision, knowledge baseline, lock graph, verified outputs, evidence, docs, archives, and PHASE_15_VERIFICATION_PASS and perform no remote or Git mutation",
          "Scripts strictly validate named inputs, reject ambiguity and path hazards, write machine-readable results under .dx/ads, and never hide mutation",
          "After locked restore all mandatory activity runs without network and verifies network prohibition",
          "Exact dependency versions use direct qualification; all WP17-01 selections are exact before development carrier delivery",
          "CI delegates to repository scripts and release eligibility requires every accepted gate and no prohibited effect"
        ],
        "name": "Build, Verification, Packaging, and Release Command Contract"
      },
      {
        "id": "17.12",
        "locked": [
          "Decisions 17.1 through 17.11 are mutually consistent and preserve all accepted constraints through Phase 16",
          "The complete Phase 17 specification defines repository, source, runtime, product, Infrastructure, MCP, verification, operations, release, delivery, and command dimensions",
