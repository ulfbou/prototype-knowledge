      "included": [
        "local stdio",
        "tools and resources",
        "stable discovery",
        "application mappings",
        "structured ADS envelopes",
        "blocked-versus-failed distinction",
        "server-established actor identity",
        "mode and authority enforcement",
        "resource templates",
        "idempotency",
        "cancellation",
        "bounded progress",
        "protocol conformance tests"
      ]
    },
    "primitive_rules": {
      "prompt": "Optional explicit user-selected workflow aid that adds no authority or mutation; omitted initially.",
      "resource": "Expose bounded identifiable read-only application context through an ads URI.",
      "tool": "Invoke an application command or model-selected computed query with structured arguments and authorization enforcement."
    },
    "progress": [
      "progress is bounded telemetry rather than ledger history",
      "semantic phases may include resolving-inputs, validating-evidence, executing-reflection, validating-result, appending-record, and complete",
      "never expose private reasoning, unrestricted evidence, secrets, or unstable internals"
    ],
    "proposal_discovery_decision": "ads_generate_proposal remains discoverable in ADVISORY mode and returns ADS_OPERATING_MODE_RESTRICTED until REVIEW_REQUIRED is explicitly established.",
