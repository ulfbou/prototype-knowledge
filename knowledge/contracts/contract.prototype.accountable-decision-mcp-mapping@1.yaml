{
  "authority": {
    "class": "normative-cross-repository-contract",
    "owner": "prototype-knowledge"
  },
  "content": {
    "actor_identity": [
      "MCP request metadata does not establish ADS actor authority",
      "server configuration and host authentication establish actor context",
      "model-supplied actor roles are non-authoritative",
      "human approval cannot be inferred from tool invocation or input-required continuation",
      "credentials never enter ledger records"
    ],
    "boundary": "MCP is a replaceable host adapter over the transport-neutral application layer. Protocol discovery, metadata, descriptions, resources, prompts, client behavior, and model output never grant authority or alter application transaction semantics.",
    "cancellation": [
      "propagate MCP cancellation to the application invocation",
      "check before append lock",
      "append no partial reflection",
      "do not undo completed appends",
      "resolve ambiguous completion using the same idempotency key"
    ],
    "capabilities": {
      "prompts": "not declared in the first executable slice",
      "resources": {
        "listChanged": false,
        "subscribe": false
      },
      "tools": {
        "listChanged": false
      }
    },
    "deferred_resources": [
      "ads://capabilities/{capabilityId}/{version}/quality",
      "ads://publication-plans/{planId}"
    ],
    "deferred_tools": [
      "CreateKnowledgeCandidate",
      "RecordCandidateReview",
      "PreparePublicationPlan",
      "PreparePublicationDelta",
      "RecordPublication",
      "EvaluateCapabilityQuality",
      "ApplyAutomaticDemotion",
      "RecordModeDecision",
      "RecordCorrection"
    ],
    "discovery": [
      "list implemented tools in deterministic order",
      "keep discovery stable across operating-mode changes",
      "recheck authority and mode for every call",
      "return ADS_OPERATING_MODE_RESTRICTED when a listed tool is unavailable in the current mode",
      "omit a tool only when disclosure itself is unauthorized"
    ],
    "initial_resources": [
      "ads://server/capabilities",
      "ads://server/health",
      "ads://ledger/records/{recordId}",
      "ads://transactions/{transactionId}",
      "ads://transactions/{transactionId}/reflection-inputs",
      "ads://diagnostics/codes/{code}"
    ],
    "initial_tools": [
      {
        "minimum_mode": "OBSERVE_ONLY",
        "mutation": "one observation",
        "name": "ads_capture_observation",
        "use_case": "CaptureObservation"
      },
      {
        "minimum_mode": "ADVISORY",
        "mutation": "one decision",
        "name": "ads_record_decision",
        "use_case": "RecordDecision"
      },
      {
        "minimum_mode": "authority-defined",
        "mutation": "one outcome",
        "name": "ads_record_outcome",
        "use_case": "RecordOutcome"
      },
      {
        "minimum_mode": "ADVISORY",
        "mutation": "zero or one reflection",
        "name": "ads_generate_reflection",
        "use_case": "GenerateReflection"
      },
      {
        "discovery": "listed deterministically even when invocation is mode-restricted",
        "minimum_mode": "REVIEW_REQUIRED",
        "mutation": "zero or one proposal",
        "name": "ads_generate_proposal",
        "use_case": "GenerateProposal"
      },
      {
        "mutation": "none",
        "name": "ads_list_incomplete_transactions",
        "use_case": "ListIncompleteTransactions"
      },
      {
        "causality": "all matches explicitly remain correlations",
        "mutation": "none",
        "name": "ads_find_similar_failures",
        "use_case": "FindSimilarFailures"
      },
      {
        "mutation": "none",
        "name": "ads_validate_ledger",
        "use_case": "ValidateLedger"
      }
    ],
    "input_required_boundary": [
      "may request bounded factual input or explicit non-authoritative selection",
      "must not obtain credentials",
      "must not synthesize maintainer review, authority escalation, publication approval, candidate-gate bypass, or mode restoration"
