      "dynamic objects use templates rather than exhaustive listing",
      "results are deterministic for equal state, policy, authorization, and arguments",
      "arbitrary local file access is prohibited"
    ],
    "resource_scheme": "ads",
    "result_mapping": {
      "application_failure": "tool execution error retaining stable ADS code and mutation status",
      "blocked": "MCP successful exchange with ADS blocked envelope, isError false, and mutationsPerformed false",
      "json_rpc_error": "reserved for malformed protocol messages, unknown MCP methods, invalid framing, protocol incompatibility, or adapter failure before application invocation",
      "succeeded": "MCP successful tool result with structured ADS envelope and isError false"
    },
    "security": [
      "repository roots and ADS storage paths are configured rather than model supplied",
      "all paths are normalized and containment checked",
      "CR, LF, NUL, traversal, arbitrary HTTP retrieval, and arbitrary filesystem resources are rejected",
      "only LedgerStore writes JSONL",
      "record identities, timestamps, hashes, and actor context are server established",
      "descriptions and annotations are advisory and never replace enforcement"
    ],
    "server_identity": {
