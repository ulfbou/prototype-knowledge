    "decisions": [
      {
        "id": "15.1",
        "locked": [
          "verification is claim-driven, evidence-proportional, deterministic, independently reproducible, and performed at the responsible boundary",
          "material claims use stable V15 identities and one primary taxonomy class",
          "evidence levels E1 through E6 have increasing strength and weaker evidence cannot substitute for required stronger evidence",
          "every mutation claim compares exact authoritative pre-state and post-state; record count alone is insufficient",
          "negative-space claims define an observation boundary capable of detecting prohibited effects",
          "PASS, FAIL, BLOCKED_PREREQUISITE, NOT_RUN, NOT_APPLICABLE, INCONCLUSIVE, and DEFERRED_BY_ACCEPTED_SCOPE remain distinct",
          "Phase 10 acceptance and Phase 14 security remain source authority",
          "development remains unauthorized"
        ],
        "name": "Verification Objectives, Claim Taxonomy, and Evidence Standard"
      },
      {
        "id": "15.2",
        "locked": [
          "seven logical projects cover Domain, Application, Infrastructure, Host.Mcp, App, Architecture, and Conformance tests",
          "tests follow production authority boundaries and production code gains no public test backdoors",
          "real adapters and actual executables are required for physical persistence, filesystem, protocol, lifecycle, platform, and output claims",
          "xUnit remains conditional and every xUnit test class explicitly includes using Xunit;",
          "test doubles implement bounded ports only and cannot prove the real adapter property they replace",
          "the process harness isolates stdin, stdout, stderr, workspace, environment, ledger, and evidence roots",
          "an independent ledger oracle verifies framing, canonical bytes, hashes, references, and mutation delta",
          "concurrency tests use deterministic signals rather than sleeps or completion polling"
        ],
        "name": "Test Architecture, Project Topology, and Harness Boundaries"
      },
      {
        "id": "15.3",
        "locked": [
          "one versioned machine-readable catalog owns stable claim identities, propositions, applicability, minimum evidence, assertions, prohibited effects, and mappings",
          "all E10-01 through E10-17, D10-P1 and D10-S1 through D10-S15, and SO14-01 through SO14-10 map explicitly to mandatory V15 claims",
          "every mandatory claim must reach CLAIM_PASS",
          "platform-output matrix reduction requires an explicit bounded equivalence argument",
          "broad suite or demonstration success cannot replace a failed or unmapped mandatory claim"
        ],
        "name": "Claim Catalog, Phase 10 Mapping, and Mandatory Conformance Matrix"
      },
      {
        "id": "15.4",
        "locked": [
          "fixtures use stable F15 identities, versions, exact bytes, hashes, and immutable meaning",
          "oracles use stable O15 identities and do not reuse production logic for the property verified",
          "faults use stable X15 identities, one declared activation boundary, and activation proof",
          "persistence fault stages preserve RESOLVED_ZERO, RESOLVED_ONE, and UNRESOLVED truth",
          "filesystem races, ownership conflicts, protocol delivery failures, evidence drift, reflection faults, and recovery faults use deterministic coordination",
          "oracle disagreement and missed or unexpected faults prevent claim pass",
          "fuzzing is bounded, seeded, supplementary, and produces minimized fixed regression fixtures"
        ],
        "name": "Deterministic Fixtures, Independent Oracles, and Fault-Injection Protocol"
      },
      {
        "id": "15.5",
        "locked": [
          "required platforms are win-x64 and linux-x64",
          "framework-dependent net10.0, RID self-contained, and RID Native AOT executables receive actual conformance execution",
          "framework-dependent output is the reference; Native AOT becomes preferred only after complete qualification and self-contained remains fallback",
          "equivalent deterministic inputs produce equivalent ADS semantics and identical canonical record bytes and hashes",
          "Dx.Domain, official C# MCP SDK, RFC 8785 implementation, and xUnit remain conditional pending exact qualification",
          "locked restore, explicit sources, source mapping, dependency graph, provenance, licensing, advisories, trimming, Native AOT, and runtime capability are verified",
          "Windows ZIP and Linux TAR.GZ are passive, safe, hash-identified, round-trip verified archives",
          "one output or platform success cannot conceal another required cell failure"
        ],
        "name": "Platform, Build-Output, Dependency, and Distribution Conformance"
      },
      {
        "id": "15.6",
        "locked": [
          "CI orchestrates but does not define semantics, claims, readiness, authority, or mutation truth",
          "pull-request, main, release-candidate, and local contexts remain distinct",
          "eleven canonical gates G15-01 through G15-11 cover repository validation, restore, build, tests, process, security, matrix, distribution, demonstrations, evidence, and aggregation",
          "completed evidence is immutable, hash-identified, privacy-bounded, and tied to one consistent source, baseline, graph, binary, platform, and output identity",
          "automatic retry is limited to bounded non-mutating transient infrastructure failures",
          "partial success cannot claim PHASE_15_VERIFICATION_PASS",
          "aggregate pass is deterministic and has no manual force-pass field",
          "CI and aggregation infrastructure require self-tests"
        ],
        "name": "CI Gates, Evidence Artifacts, and Aggregate Verification Reporting"
      },
      {
        "id": "15.7",
        "locked": [
          "Phase 15 completion concerns strategy completeness rather than execution of an unimplemented system",
          "claim, evidence, boundary, fixture, oracle, matrix, dependency, CI, deferral, and consistency dimensions must be complete",
          "exact Phase 17 projects, files, versions, tools, schemas, scripts, and workflows are bounded new deliverables, not blockers",
          "mandatory claim identities, mappings, evidence strength, authoritative state comparison, platforms, outputs, and security requirements cannot be deferred",
          "true blockers require an architectural verification conflict or unavailable existing prerequisite",
          "no Phase 15 architectural blocker exists and PHASE_15_REVIEW_READY is established"
        ],
        "name": "Verification Completion Criteria, Deferrals, and Phase 15 Review Preparation"
      },
      {
        "id": "15.8",
        "locked": [
          "Decisions 15.1 through 15.7 are mutually consistent and accepted as one verification baseline",
          "mandatory product, authority, mutation, ledger, evidence, reflection, security, privacy, resource, protocol, lifecycle, recovery, dependency, compatibility, and distribution coverage is complete",
          "planning items are DEFINED or DEFINED_WITH_BOUNDED_DEPENDENCY; none are INCOMPLETE or BLOCKED_BY_ARCHITECTURAL_CONFLICT",
          "PHASE_15_STRATEGY_COMPLETE",
          "future execution remains separately PHASE_15_VERIFICATION_PASS or PHASE_15_VERIFICATION_FAIL",
          "the next phase is Phase 16 Documentation and Operational Model",
          "development remains unauthorized until Phase 18 returns READY or an explicitly accepted READY_WITH_BOUNDED_RISKS"
        ],
        "name": "Phase 15 Verification and Conformance Review and Lock"
      }
    ],
    "dependency_qualification": [
      "exact version, source, graph, lock identity, bounded purpose, license, provenance, advisories, platform, trimming, Native AOT, offline behavior, capability, isolation, replacement boundary, limitations, and disposition",
      "permitted dispositions are QUALIFIED, QUALIFIED_WITH_BOUNDED_LIMITATIONS, REJECTED, and DEFERRED_FOR_MISSING_EVIDENCE",
      "mandatory production dependencies cannot remain deferred for aggregate verification pass"
    ],
