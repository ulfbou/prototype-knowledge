    "decisions": [
      {
        "id": "16.1",
        "locked": [
          "documentation explains accepted contracts and executable behavior but grants no authority and cannot redefine product semantics, runtime authority, mutation truth, recovery authority, or validation",
          "technical delivery operator, authorized maintainer, developer and verifier, and support investigator are documentation audiences and responsibilities rather than new runtime roles",
          "the logical documentation set covers overview, configuration, installation and launch, lifecycle, diagnostics, degraded inspection, recovery, security and privacy, verification, and troubleshooting and support",
          "task-oriented and condition-oriented navigation use stable operation, diagnostic, lifecycle, disposition, certainty, verification, security, and recovery identifiers",
          "every procedure states authority, prerequisites, affected assets, mutation expectations, prohibited effects, verification, stop conditions, and one permissible next action",
          "exact files, tooling, commands, and repository paths remain Phase 17 deliverables"
        ],
        "name": "Documentation Authority, Audience, and Information Architecture"
      },
      {
        "id": "16.2",
        "locked": [
          "authority-bearing configuration is operator-controlled, complete, validated before readiness, immutable for one runtime instance, and not overridable by ordinary requests",
          "configuration separately identifies runtime, principal and actor, operating mode and policy, ledger, evidence, resource limits, privacy and diagnostics, dependency and executable, lifecycle, and recovery domains",
          "launch validates supported output, identities, roots, permissions, ownership, dependencies, stream separation, offline availability, and network and arbitrary-execution prohibitions",
          "launch follows CREATED then INITIALIZING, establishes trusted context, containment, ownership, complete ledger validity, derived state and stdio isolation, and only then enters READY",
          "startup appends zero lifecycle records and failures cannot trigger silent repair, alternate ledger selection, authority changes, or storage fallback",
          "configuration changes create a new fully validated runtime instance; exact representation and launch commands remain Phase 17 deliverables"
        ],
        "name": "Trusted Configuration and Secure Launch Guidance"
      },
      {
        "id": "16.3",
        "locked": [
          "App exclusively owns lifecycle and admission across CREATED, INITIALIZING, READY, DRAINING, STOPPED, INITIALIZATION_FAILED, and TERMINATION_UNCLEAN",
          "draining atomically closes admission before waiting and admitted operations retain authority, policy, idempotency, cancellation, and mutation-certainty semantics",
          "graceful shutdown closes append capability before releasing writer ownership and reports STOPPED only when clean termination criteria are proven",
          "in-flight mutation is RESOLVED_ZERO before possible persistence, RESOLVED_ONE after confirmed append, or UNRESOLVED while authoritative truth is unknown",
          "unclean termination grants no recovery, ownership-takeover, readiness, authority, or operating-mode restoration",
          "restart creates a new runtime instance and re-establishes configuration, authority, ownership, ledger validity, unresolved completion, projections, host isolation, and readiness from persisted authority"
        ],
        "name": "Runtime Lifecycle, Shutdown, and Restart Operations"
      },
      {
        "id": "16.4",
        "locked": [
          "degraded inspection is a bounded non-mutating runtime condition, not a lifecycle state, operating mode, recovery workflow, alternate authority, or readiness bypass",
          "entry requires closed mutation admission, trusted configuration and executable identity sufficient for inspection, containment, resource bounds, output isolation, and preservation of source evidence",
          "inspection may expose only registered bounded read-only configuration, lifecycle, ledger identity, ownership, validation, fragment, evidence, dependency, diagnostic, recovery-prerequisite, and verification facts",
          "a validated prefix is explicitly not the complete ledger and cannot establish absent later records, mutation truth, current transaction state, or authority for new mutation",
          "invalid complete records are preserved and never skipped or repaired; incomplete trailing fragments are separately identified and preserved but not truncated",
          "inspection ends with ordinary restart, further inspection, authorized recovery, manual disposition, or termination, and never restores READY, writer authority, actor authority, mutation admission, or operating mode"
        ],
        "name": "Degraded Inspection and Authoritative Diagnostic Operations"
      },
      {
        "id": "16.5",
        "locked": [
          "recovery is separately authenticated, explicitly authorized, asset-scoped, action-scoped, evidence-preserving, exclusive, and distinct from runtime, restart, degraded inspection, maintainer activity, and MCP",
          "the only initial ledger-content recovery mutation is exact truncation of proven bytes after the final valid complete LF-terminated record",
          "invalid complete records, ambiguous boundaries, identity drift, ownership ambiguity, unavailable preservation, and missing plan or validation capability block recovery without mutation",
          "complete source bytes are preserved and verified before mutation, and a machine-readable single-use plan binds identities, hashes, boundaries, expected result, certainty, validations, and prohibited effects",
          "recovery certainty is RESOLVED_ZERO, RESOLVED_ONE, or UNRESOLVED; confirmed success proves exact retained-prefix byte identity and complete semantic ledger validity",
          "successful technical recovery appends zero ADS lifecycle records and does not restore readiness, ordinary writer ownership, actor authority, operating mode, or unrelated uncertain operations"
        ],
        "name": "Authorized Recovery and Post-Recovery Validation"
      },
      {
        "id": "16.6",
        "locked": [
          "diagnostic ownership follows Application product semantics, Host.Mcp pre-invocation protocol semantics, Infrastructure technical facts, and App runtime coordination",
          "product outcome, protocol outcome, persistence completion, lifecycle, runtime disposition, mutation certainty, and security classification remain independently represented",
          "each stable diagnostic defines identity, meaning, result mapping, safe facts, evidence, prohibited actions, retry classification, one continuation, and Phase 15 verification mapping",
          "multiple conditions produce one primary diagnostic according to accepted evaluation precedence plus safe independent contributing conditions",
          "incidents are request-local, mutation-restriction, degraded-inspection, draining, or unclean-termination conditions and security response prioritizes authoritative truth, safe mutation, certainty, containment, protocol safety, and evidence",
          "support handoff preserves bounded facts, artifact identity, unresolved questions, required receiving authority, and one continuation but transfers no runtime or recovery authority"
        ],
        "name": "Diagnostic Reference, Incident Classification, and Support Handoff"
      },
      {
        "id": "16.7",
        "locked": [
          "completion covers authority, lifecycle, mutation, ledger, security and privacy, operations, diagnostics, evidence, platforms, verification, maintenance, and deferrals",
          "planning states are DEFINED, DEFINED_WITH_BOUNDED_DEPENDENCY, DEFERRED_BY_ACCEPTED_SCOPE, BLOCKED_BY_ARCHITECTURAL_CONFLICT, and INCOMPLETE",
          "only DEFINED, DEFINED_WITH_BOUNDED_DEPENDENCY, and justified DEFERRED_BY_ACCEPTED_SCOPE are compatible with Phase 16 completion",
          "documentation ownership follows the authority of documented information; material contract changes require impact assessment and stale applicability is version-identifiable",
          "copy-ready examples and procedures require risk-proportionate executable verification and future aggregate execution is PHASE_16_DOCUMENTATION_PASS or PHASE_16_DOCUMENTATION_FAIL",
          "Phase 17 owns exact artifacts, schemas, paths, commands, mechanisms, tooling, work packages, order, and acceptance commands; Phase 18 owns readiness and residual-risk disposition"
        ],
        "name": "Operational Documentation Completion Criteria, Maintenance, and Explicit Deferrals"
      },
      {
        "id": "16.8",
        "locked": [
          "Decisions 16.1 through 16.7 are mutually consistent, accepted, and locked as one documentation and operational baseline",
          "all prior product, authority, runtime, persistence, evidence, mutation, protocol, repository, security, privacy, and verification constraints through Phase 15 remain preserved",
          "all mandatory Phase 16 concerns are DEFINED or DEFINED_WITH_BOUNDED_DEPENDENCY and none are INCOMPLETE or BLOCKED_BY_ARCHITECTURAL_CONFLICT",
          "PHASE_16_DOCUMENTATION_MODEL_COMPLETE",
          "development remains unauthorized until Phase 18 returns READY or an explicitly accepted READY_WITH_BOUNDED_RISKS",
          "the next phase is Phase 17: Vertical Slice Delivery Specification"
        ],
        "name": "Phase 16 Documentation and Operational Model Review and Lock"
      }
