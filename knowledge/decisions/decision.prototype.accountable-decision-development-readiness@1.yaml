      "complete records are immutable",
      "incomplete trailing fragments are evidence not records",
      "invalid complete records are never silently repaired, skipped, rewritten, normalized, or truncated",
      "per-record RFC 8785 and SHA-256 with no hash chain",
      "one local process, one stdio MCP host, one configured JSONL ledger, one writer process",
      "mandatory behavior is network-independent",
      "proposal is non-authoritative",
      "runtime repository, Git, and GitHub mutation is prohibited"
