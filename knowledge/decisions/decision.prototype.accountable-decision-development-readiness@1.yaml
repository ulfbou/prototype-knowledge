    "preserved_invariants": [
      "persona does not grant runtime authority",
      "authority is independently established per operation",
      "Application owns product semantics",
      "SUCCEEDED, BLOCKED, and FAILED remain distinct",
      "successful new mutating commands append at most one record",
      "blocked, failed, read-only, replay, and conflicting-key operations append zero records",
