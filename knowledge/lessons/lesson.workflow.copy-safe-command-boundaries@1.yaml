    "high_risk_edits": [
      "nested shell quoting",
      "heredocs",
      "traps",
      "multiline replacements",
      "cross-shell path conversion"
    ],
    "rules": [
      "provide one command or one short atomic block at a time",
      "do not change strict-mode settings in the interactive shell",
      "do not invoke shell termination from interactive instructions",
      "avoid redundant exit-status plumbing when output is conclusive",
      "use exact paths and arguments without placeholders",
      "move complex quoting and failure handling into a validated child script or correction artifact"
    ]
  },
